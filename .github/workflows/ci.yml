name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OUTBOX_PROCESS_SECRET: ci-outbox-secret
      WEBHOOK_PROCESS_SECRET: ci-webhook-secret
      CALENDAR_SYNC_SECRET: ci-calendar-sync-secret
      CRON_SECRET: ci-cron-secret
      GOOGLE_CALENDAR_CLIENT_ID: ci-google-client-id
      GOOGLE_CALENDAR_CLIENT_SECRET: ci-google-client-secret
      MICROSOFT_CALENDAR_CLIENT_ID: ci-microsoft-client-id
      MICROSOFT_CALENDAR_CLIENT_SECRET: ci-microsoft-client-secret
      MICROSOFT_CALENDAR_TENANT: common
      CALENDAR_TOKEN_ENCRYPTION_SECRET: ci-calendar-token-encryption-secret-32-bytes
      EMAIL_PROVIDER: console
      EMAIL_FROM: "OpenSlot <bookings@example.com>"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
