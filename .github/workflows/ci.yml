name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OUTBOX_PROCESS_SECRET: ci-outbox-secret
      WEBHOOK_PROCESS_SECRET: ci-webhook-secret
      CALENDAR_SYNC_SECRET: ci-calendar-sync-secret
      CRON_SECRET: ci-cron-secret
      GOOGLE_CALENDAR_CLIENT_ID: ci-google-client-id
      GOOGLE_CALENDAR_CLIENT_SECRET: ci-google-client-secret
      MICROSOFT_CALENDAR_CLIENT_ID: ci-microsoft-client-id
      MICROSOFT_CALENDAR_CLIENT_SECRET: ci-microsoft-client-secret
      MICROSOFT_CALENDAR_TENANT: common
      CALENDAR_TOKEN_ENCRYPTION_SECRET: ci-calendar-token-encryption-secret-32-bytes
      EMAIL_PROVIDER: console
      EMAIL_FROM: "OpenSlot <bookings@example.com>"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  database:
    name: Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.2

      - name: Start local database
        run: supabase db start

      - name: Reset local database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint local database schema
        run: supabase db lint --local --fail-on error

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup || true

  e2e:
    name: Page E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      OUTBOX_PROCESS_SECRET: ci-outbox-secret
      WEBHOOK_PROCESS_SECRET: ci-webhook-secret
      CALENDAR_SYNC_SECRET: ci-calendar-sync-secret
      CRON_SECRET: ci-cron-secret
      GOOGLE_CALENDAR_CLIENT_ID: ci-google-client-id
      GOOGLE_CALENDAR_CLIENT_SECRET: ci-google-client-secret
      MICROSOFT_CALENDAR_CLIENT_ID: ci-microsoft-client-id
      MICROSOFT_CALENDAR_CLIENT_SECRET: ci-microsoft-client-secret
      MICROSOFT_CALENDAR_TENANT: common
      CALENDAR_TOKEN_ENCRYPTION_SECRET: ci-calendar-token-encryption-secret-32-bytes
      EMAIL_PROVIDER: console
      EMAIL_FROM: "OpenSlot <bookings@example.com>"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.98.2

      - name: Start local Supabase
        run: supabase start

      - name: Reset and seed local database
        run: supabase db reset --local

      - name: Export local Supabase env
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed -E 's/^([^=]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Run page E2E
        run: npm run test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
