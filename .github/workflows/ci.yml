name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_BUTTERBASE_APP_ID: app_ci_placeholder
      NEXT_PUBLIC_BUTTERBASE_API_URL: https://api.butterbase.ai
      BUTTERBASE_API_KEY: ci-butterbase-service-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OUTBOX_PROCESS_SECRET: ci-outbox-secret
      WEBHOOK_PROCESS_SECRET: ci-webhook-secret
      CALENDAR_SYNC_SECRET: ci-calendar-sync-secret
      CRON_SECRET: ci-cron-secret
      GOOGLE_CALENDAR_CLIENT_ID: ci-google-client-id
      GOOGLE_CALENDAR_CLIENT_SECRET: ci-google-client-secret
      MICROSOFT_CALENDAR_CLIENT_ID: ci-microsoft-client-id
      MICROSOFT_CALENDAR_CLIENT_SECRET: ci-microsoft-client-secret
      MICROSOFT_CALENDAR_TENANT: common
      CALENDAR_TOKEN_ENCRYPTION_SECRET: ci-calendar-token-encryption-secret-32-bytes
      EMAIL_PROVIDER: console
      EMAIL_FROM: "OpenSlot <bookings@example.com>"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Dashboard E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      TZ: America/New_York
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BUTTERBASE_APP_ID: ${{ vars.BUTTERBASE_APP_ID }}
      NEXT_PUBLIC_BUTTERBASE_API_URL: https://api.butterbase.ai
      BUTTERBASE_API_KEY: ${{ secrets.BUTTERBASE_API_KEY }}
      OUTBOX_PROCESS_SECRET: ci-outbox-secret
      WEBHOOK_PROCESS_SECRET: ci-webhook-secret
      CALENDAR_SYNC_SECRET: ci-calendar-sync-secret
      CRON_SECRET: ci-cron-secret
      GOOGLE_CALENDAR_CLIENT_ID: ci-google-client-id
      GOOGLE_CALENDAR_CLIENT_SECRET: ci-google-client-secret
      MICROSOFT_CALENDAR_CLIENT_ID: ci-microsoft-client-id
      MICROSOFT_CALENDAR_CLIENT_SECRET: ci-microsoft-client-secret
      MICROSOFT_CALENDAR_TENANT: common
      CALENDAR_TOKEN_ENCRYPTION_SECRET: ci-calendar-token-encryption-secret-32-bytes
      EMAIL_PROVIDER: console
      EMAIL_FROM: "OpenSlot <bookings@example.com>"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Butterbase E2E configuration
        id: butterbase-e2e
        run: |
          if [ -z "$NEXT_PUBLIC_BUTTERBASE_APP_ID" ] || [ -z "$BUTTERBASE_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Dashboard E2E because BUTTERBASE_APP_ID or BUTTERBASE_API_KEY is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium
        if: steps.butterbase-e2e.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run dashboard E2E
        if: steps.butterbase-e2e.outputs.configured == 'true'
        run: npm run test:e2e
